<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iTech Uni | Sign in to the University Management System</title>
<meta name="description" content="iTech Uni management system for administrators, teachers, accountants and students: accounts, marks, attendance and fee records.">
<meta name="theme-color" content="#0d1b2a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230d1b2a'/%3E%3Crect x='27' y='26' width='10' height='24' fill='%23fff'/%3E%3Crect x='27' y='12' width='10' height='9' fill='%232196f3'/%3E%3C/svg%3E">
<style>
:root{--navy:#0d1b2a;--blue:#1a3a5c;--accent:#1976d2;--white:#fff;--light:#f0f4f8;--muted:#667788;--danger:#c0392b;--success:#1e8449;--warn:#b9770e;--border:#dde3ea;--radius:8px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;overflow-x:hidden}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--light);color:var(--navy);min-height:100vh;line-height:1.45}
button,input,select{font:inherit}
[hidden]{display:none!important}

/* auth */
.auth-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:var(--navy)}
.auth-card{background:#fff;border-radius:12px;padding:32px 28px;width:100%;max-width:420px}
.auth-card h1{font-size:22px}
.auth-card .sub{font-size:14px;color:var(--muted);margin:4px 0 22px}
.fg{margin-bottom:16px;min-width:0}
.fg label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.fg input,.fg select{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:6px;font-size:16px;background:#fff;color:var(--navy)}
.fg input:focus,.fg select:focus,.btn:focus-visible,.ni:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.err{color:var(--danger);font-size:12px;margin-top:4px}
.btn{padding:10px 18px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;display:inline-block}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#1565c0}
.btn-block{width:100%}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-outline{background:#fff;border:1.5px solid var(--accent);color:var(--accent)}
.lock-msg{background:#fdecea;border:1px solid #e6b0aa;border-radius:6px;padding:10px 12px;font-size:13px;color:#922b21;margin-bottom:16px}
.cap-row{display:flex;align-items:center;gap:10px;background:var(--light);border-radius:6px;padding:8px 12px;border:1.5px solid var(--border)}
.cap-q{font-weight:700;color:var(--blue);flex:1}
.cap-row input{border:none;border-bottom:2px solid var(--accent);border-radius:0;background:transparent;width:80px;padding:4px}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:20px 0 4px}
.auth-wrap .foot{color:rgba(255,255,255,.6)}

/* layout */
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--navy);color:#fff;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;display:flex;flex-direction:column}
.sb-brand{padding:20px;border-bottom:1px solid rgba(255,255,255,.1);font-size:17px;font-weight:700}
.sb-user{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.1);font-size:13px}
.sb-user .uname{font-weight:600}
.sb-user .uemail{color:rgba(255,255,255,.6);word-break:break-all}
.rbadge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;margin-top:6px;background:#1976d2}
.r-admin{background:#c0392b}.r-teacher{background:#1e8449}.r-accountant{background:#b9770e}
.nsec{font-size:10px;font-weight:600;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.08em;padding:16px 20px 6px}
.ni{display:block;width:100%;text-align:left;background:none;border:none;border-left:3px solid transparent;padding:10px 20px;cursor:pointer;font-size:14px;color:rgba(255,255,255,.8)}
.ni:hover,.ni.active{background:rgba(255,255,255,.08);color:#fff;border-left-color:var(--accent)}
.sb-bot{margin-top:auto;padding:14px 20px;border-top:1px solid rgba(255,255,255,.1)}
.lout{background:none;border:none;color:rgba(255,255,255,.75);cursor:pointer;font-size:14px;padding:4px 0}
.lout:hover{color:#f1948a}
.main{margin-left:240px;flex:1;min-width:0;padding:24px;display:flex;flex-direction:column}
.mbar{display:none}
.scrim{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}
.topbar h2{font-size:21px}
.clock{font-size:13px;color:var(--muted)}
#content{flex:1;min-width:0}

/* cards, tables */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.sc{background:#fff;border-radius:var(--radius);padding:16px;border:1px solid var(--border);border-left:4px solid var(--accent)}
.sc .val{font-size:26px;font-weight:700}
.sc .lbl{font-size:12px;color:var(--muted)}
.card{background:#fff;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:18px}
.ch{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.ch h3{font-size:15px}
.cb{padding:18px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--light);padding:9px 12px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;word-break:break-word}
tr:last-child td{border-bottom:none}
.empty{text-align:center;color:var(--muted);padding:12px 0}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.bg-success{background:#d4edda;color:#155724}.bg-danger{background:#f8d7da;color:#721c24}
.bg-warn{background:#fff3cd;color:#7d5a05}.bg-info{background:#d6e8fa;color:#0b3d73}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.alert{padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:14px;background:#d6e8fa;color:#0b3d73;border:1px solid #b8d4f0}
.str-bar{height:5px;border-radius:3px;background:var(--border);margin-top:6px}
.str-fill{height:100%;border-radius:3px;width:0;background:var(--danger)}
.welcome{background:var(--navy);color:#fff;border-radius:var(--radius);padding:18px 20px;margin-bottom:18px}
.welcome small{opacity:.7}
.welcome h3{font-size:21px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pgrid div{padding:11px;background:var(--light);border-radius:6px;word-break:break-word}
.pgrid small{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.acc-denied{text-align:center;padding:50px 20px}
.acc-denied h2{color:var(--danger);margin-bottom:8px}
.chip{display:inline-block;background:var(--light);border-radius:4px;padding:2px 8px;font-size:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap}

/* modal and toast */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:15px}
.mi{background:#fff;border-radius:10px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.mh{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mh h3{font-size:16px}
.mc{padding:20px}
.mf{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.xbtn{cursor:pointer;font-size:22px;line-height:1;color:var(--muted);border:none;background:none;padding:2px 8px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:300;max-width:calc(100% - 32px);padding:12px 18px;border-radius:6px;color:#fff;font-size:14px;background:var(--success)}
#toast.bad{background:var(--danger)}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90}
  .mbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:80;background:var(--navy);color:#fff;padding:10px 14px}
  .mbar strong{font-size:16px}
  .app{flex-direction:column}
  .main{margin-left:0;padding:14px;width:100%}
  .topbar{margin-bottom:14px}
  .clock{display:none}
}
@media(max-width:700px){
  .form-row{grid-template-columns:1fr}
  .cb{padding:12px}
  .rt thead{display:none}
  .rt,.rt tbody,.rt tr,.rt td{display:block;width:100%}
  .rt tr{border:1px solid var(--border);border-radius:6px;margin-bottom:10px;padding:4px 0}
  .rt td{border:none;padding:6px 12px;display:flex;justify-content:space-between;gap:12px;text-align:right}
  .rt td::before{content:attr(data-label);font-weight:700;color:var(--muted);font-size:11px;text-transform:uppercase;text-align:left;flex:0 0 38%}
  .rt .acts{justify-content:flex-end}
  .auth-card{padding:24px 18px}
}
</style>
</head>
<body>

<div id="pg-login" class="auth-wrap">
  <div class="auth-card">
    <h1>iTech Uni</h1>
    <p class="sub">Sign in with your university account</p>
    <div id="lock-notice" class="lock-msg" role="alert" hidden></div>
    <form onsubmit="doLogin(event)" novalidate>
      <div class="fg">
        <label for="l-email">Email address</label>
        <input type="email" id="l-email" placeholder="name@example.com" autocomplete="username" inputmode="email">
        <div class="err" id="er-email" hidden>Enter a valid email.</div>
      </div>
      <div class="fg">
        <label for="l-pass">Password</label>
        <input type="password" id="l-pass" autocomplete="current-password">
        <div class="err" id="er-pass" hidden>Password is required.</div>
      </div>
      <div class="fg">
        <label for="cap-a">Security question</label>
        <div class="cap-row">
          <span class="cap-q" id="cap-q"></span>
          <input type="number" id="cap-a" inputmode="numeric" placeholder="Answer">
        </div>
        <div class="err" id="er-cap" hidden>Wrong answer. Try the new question.</div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
  </div>
  <footer class="foot">&copy; 2026 iTech Uni. All rights reserved.</footer>
</div>

<div id="pg-app" class="app" hidden>
  <div class="scrim" id="scrim" onclick="toggleMenu(false)"></div>
  <nav class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="sb-brand">iTech Uni</div>
    <div class="sb-user">
      <div class="uname" id="sb-name"></div>
      <div class="uemail" id="sb-email"></div>
      <span class="rbadge" id="sb-rbadge"></span>
    </div>
    <div id="sb-nav"></div>
    <div class="sb-bot"><button class="lout" onclick="doLogout()">Sign out</button></div>
  </nav>
  <main class="main">
    <header class="mbar">
      <button class="btn btn-outline btn-sm" id="menu-btn" aria-controls="sidebar" aria-expanded="false" onclick="toggleMenu()">Menu</button>
      <strong>iTech Uni</strong>
    </header>
    <div class="topbar">
      <h2 id="pg-title">Dashboard</h2>
      <div class="clock" id="clk"></div>
    </div>
    <div id="content"></div>
    <footer class="foot">&copy; 2026 iTech Uni. All rights reserved.</footer>
  </main>
</div>

<div id="modal" class="mo" hidden onclick="if(event.target===this)closeM()">
  <div class="mi" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div class="mh"><h3 id="m-title"></h3><button class="xbtn" aria-label="Close" onclick="closeM()">&times;</button></div>
    <div class="mc" id="m-body"></div>
    <div class="mf" id="m-foot"></div>
  </div>
</div>
<div id="toast" role="status" hidden></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const v=x=>x?esc(x):'N/A';

const SEED={
  users:[
    {UserID:'U001','Full Name':'Abdullah Afzal',Email:'abdullahafzalbscs14@gmail.com',Password:'Abdull@h1122',Role:'admin','Created By (UserID)':'SYSTEM','Created By Role':'system',Status:'active','Created Date':'2026-08-31',Phone:'0300-1234567',Department:'Administration'},
    {UserID:'U002','Full Name':'Prof. Ali Raza',Email:'ali.raza@itech.edu.pk',Password:'Teacher@123',Role:'teacher','Created By (UserID)':'U001','Created By Role':'admin',Status:'active','Created Date':'2026-08-31',Phone:'0301-7654321',Department:'Computer Science'},
    {UserID:'U003','Full Name':'Usman Ahmed',Email:'usman.acct@itech.edu.pk',Password:'Account@123',Role:'accountant','Created By (UserID)':'U001','Created By Role':'admin',Status:'active','Created Date':'2026-08-31',Phone:'0302-9876543',Department:'Finance'},
    {UserID:'U004','Full Name':'Zaid Malik',Email:'zaid.student@itech.edu.pk',Password:'Student@123',Role:'student','Created By (UserID)':'U001','Created By Role':'admin',Status:'active','Created Date':'2026-08-31',Phone:'0303-1122334',Department:'Computer Science'}
  ],
  teachers:[{TeacherID:'T001','Full Name':'Prof. Ali Raza',Email:'ali.raza@itech.edu.pk',Password:'Teacher@123',Phone:'0301-7654321',Department:'Computer Science',Status:'active','Created By Admin':'abdullahafzalbscs14@gmail.com','Created Date':'2026-08-31'}],
  students:[{StudentID:'STU001','Full Name':'Zaid Malik',Email:'zaid.student@itech.edu.pk',Password:'Student@123',Phone:'0303-1122334',Program:'BS Computer Science',Semester:'4',Section:'A',CGPA:'3.75',Status:'active','Created By':'abdullahafzalbscs14@gmail.com','Creator Role':'admin','Created Date':'2026-08-31'}],
  accountants:[{AccountantID:'ACC001','Full Name':'Usman Ahmed',Email:'usman.acct@itech.edu.pk',Password:'Account@123',Phone:'0302-9876543',Department:'Finance',Status:'active','Created By Admin':'abdullahafzalbscs14@gmail.com','Created Date':'2026-08-31'}],
  courses:[
    {CourseID:'CS101','Course Name':'Programming Fundamentals','Teacher Name':'Prof. Ali Raza',Credits:3,Status:'active'},
    {CourseID:'CS202','Course Name':'Data Structures','Teacher Name':'Prof. Ali Raza',Credits:3,Status:'active'}
  ],
  marks:[{StudentID:'STU001','Student Name':'Zaid Malik',CourseID:'CS101','Midterm/50':45,'Final/100':90,'Total/150':135,Grade:'A+'}],
  fees:[{FeeID:'FEE001','Student Name':'Zaid Malik','Amount(PKR)':85000,'Due Date':'2026-09-15',Status:'Pending'}],
  attendance:[{StudentID:'STU001','Student Name':'Zaid Malik',CourseID:'CS101',Date:'2026-08-28',Status:'Present'}],
  secLogs:[]
};
let DB=null;
try{DB=JSON.parse(localStorage.getItem('itech_db'))}catch(e){}
if(!DB||!Array.isArray(DB.users))DB=JSON.parse(JSON.stringify(SEED));
function saveDB(){try{localStorage.setItem('itech_db',JSON.stringify(DB))}catch(e){}}

const CAN_CREATE={admin:['teacher','accountant','student','admin'],teacher:['student'],accountant:[],student:[]};
const ROLE_META={
  admin:{label:'Administrator',badge:'r-admin'},teacher:{label:'Teacher',badge:'r-teacher'},
  student:{label:'Student',badge:'r-student'},accountant:{label:'Accountant',badge:'r-accountant'}
};
const NAV={
  admin:['Overview',['dashboard','Dashboard'],'Users',['users','All Users'],['create_user','Create Account'],'Academic',['courses','Courses'],['marks','All Marks'],'Finance',['fees','Fee Records'],'Security',['logs','Security Logs'],'Account',['profile','My Profile']],
  teacher:['Overview',['dashboard','Dashboard'],'Students',['students','Students'],['create_user','Register Student'],'Academic',['marks','Marks and Grades'],['attendance','Attendance'],['courses','Courses'],'Account',['profile','My Profile']],
  student:['Overview',['dashboard','Dashboard'],'Academic',['results','My Results'],['attendance','Attendance'],['courses','Courses'],'Account',['profile','My Profile']],
  accountant:['Overview',['dashboard','Dashboard'],'Finance',['fees','Fee Records'],'Students',['students','Students'],'Account',['profile','My Profile']]
};
const tables={teacher:'teachers',student:'students',accountant:'accountants'};

/* helpers */
function findUser(email){return DB.users.find(u=>(u.Email||'').toLowerCase()===String(email).toLowerCase())}
let SESSION=null;
try{SESSION=JSON.parse(localStorage.getItem('itech_session'))}catch(e){}
function me(){return SESSION?findUser(SESSION.email):null}
function myStu(){const u=me();return u?DB.students.find(s=>(s.Email||'').toLowerCase()===u.Email.toLowerCase()):null}
function canCreate(r){const u=me();return !!u&&(CAN_CREATE[u.Role]||[]).includes(r)}
function allowedKeys(role){return (NAV[role]||[]).filter(Array.isArray).map(n=>n[0])}
function bc(s){return({Success:'bg-success',Paid:'bg-success',active:'bg-success',Present:'bg-success',Pending:'bg-warn',Late:'bg-warn',Blocked:'bg-warn'})[s]||'bg-danger'}
function badge(s){return `<span class="badge ${bc(s)}">${esc(s||'N/A')}</span>`}
function tbl(heads,rows,msg){
  if(!rows.length)return `<p class="empty">${esc(msg||'No records yet.')}</p>`;
  return `<table class="rt"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r=>`<tr>${r.map((c,i)=>`<td data-label="${esc(heads[i])}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function card(title,body,action){return `<div class="card"><div class="ch"><h3>${title}</h3>${action||''}</div><div class="cb">${body}</div></div>`}
function show(id,on){$(id).hidden=!on}
let toastT;
function toast(msg,bad){const t=$('toast');t.textContent=msg;t.className=bad?'bad':'';t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3500)}
function addLog(email,role,activity,status){
  DB.secLogs.push({Email:email,Role:role,Activity:activity,Status:status,Timestamp:new Date().toLocaleString('en-PK')});
  if(DB.secLogs.length>200)DB.secLogs.splice(0,DB.secLogs.length-200);
  saveDB();
}
function syncRole(email,fields){
  const u=findUser(email);if(!u)return;
  const t=DB[tables[u.Role]];
  const rec=t&&t.find(x=>(x.Email||'').toLowerCase()===email.toLowerCase());
  if(rec)Object.assign(rec,fields);
}

/* login */
const attempts={};
let capAns=0;
function genCap(){
  const a=Math.floor(Math.random()*12)+1,b=Math.floor(Math.random()*9)+1;
  const hi=Math.max(a,b),lo=Math.min(a,b),ops=[['+',hi+lo],['-',hi-lo],['x',hi*lo]];
  const o=ops[Math.floor(Math.random()*3)];
  $('cap-q').textContent=`What is ${hi} ${o[0]} ${lo}?`;capAns=o[1];$('cap-a').value='';
}
function doLogin(e){
  e.preventDefault();
  ['er-email','er-pass','er-cap','lock-notice'].forEach(i=>show(i,false));
  const email=$('l-email').value.trim(),pass=$('l-pass').value,cap=parseInt($('cap-a').value,10);
  let ok=true;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){show('er-email',true);ok=false}
  if(!pass){show('er-pass',true);ok=false}
  if(isNaN(cap)||cap!==capAns){show('er-cap',true);ok=false}
  if(!ok){genCap();return}
  const key=email.toLowerCase();
  const att=attempts[key]||(attempts[key]={count:0,lockTime:0});
  if(att.lockTime&&Date.now()-att.lockTime<300000){loginMsg('Account locked after 5 failed attempts. Try again in 5 minutes.');genCap();return}
  if(att.lockTime){att.count=0;att.lockTime=0}
  const user=findUser(email);
  if(!user||user.Password!==pass){
    att.count++;
    addLog(email,'unknown','Failed login #'+att.count,'Failed');
    if(att.count>=5){att.lockTime=Date.now();addLog(email,'unknown','Account locked after 5 attempts','Blocked');loginMsg('Account locked after 5 failed attempts. Try again in 5 minutes.')}
    else loginMsg(`Invalid email or password. Attempt ${att.count} of 5.`);
    genCap();return;
  }
  if((user.Status||'').toLowerCase()==='locked'){loginMsg('This account is locked. Contact an administrator.');genCap();return}
  att.count=0;att.lockTime=0;
  user['Last Login']=new Date().toLocaleString('en-PK');saveDB();
  addLog(user.Email,user.Role,'Successful login','Success');
  SESSION={email:user.Email};
  try{localStorage.setItem('itech_session',JSON.stringify(SESSION));localStorage.setItem('itech_curSec','dashboard')}catch(x){}
  $('l-pass').value='';
  loadApp();
}
function loginMsg(t){const n=$('lock-notice');n.textContent=t;n.hidden=false}
function doLogout(){
  if(!confirm('Sign out of iTech Uni?'))return;
  const u=me();if(u)addLog(u.Email,u.Role,'Sign out','Success');
  SESSION=null;
  try{localStorage.removeItem('itech_session');localStorage.removeItem('itech_curSec')}catch(e){}
  toggleMenu(false);
  show('pg-app',false);$('pg-login').hidden=false;genCap();
}

/* app shell */
function loadApp(){
  const u=me();
  if(!u||(u.Status||'').toLowerCase()==='locked'){SESSION=null;try{localStorage.removeItem('itech_session')}catch(e){}$('pg-login').hidden=false;show('pg-app',false);genCap();return}
  show('pg-login',false);$('pg-app').hidden=false;
  $('sb-name').textContent=u['Full Name'];$('sb-email').textContent=u.Email;
  const rm=ROLE_META[u.Role]||{label:u.Role,badge:''};
  $('sb-rbadge').textContent=rm.label;$('sb-rbadge').className='rbadge '+rm.badge;
  $('sb-nav').innerHTML=NAV[u.Role].map(n=>Array.isArray(n)
    ?`<button class="ni" id="ni-${n[0]}" onclick="goSection('${n[0]}')">${n[1]}</button>`
    :`<div class="nsec">${n}</div>`).join('');
  let k='dashboard';try{k=localStorage.getItem('itech_curSec')||k}catch(e){}
  goSection(allowedKeys(u.Role).includes(k)?k:'dashboard');
}
function toggleMenu(force){
  const open=typeof force==='boolean'?force:!$('sidebar').classList.contains('open');
  $('sidebar').classList.toggle('open',open);$('scrim').classList.toggle('open',open);
  $('menu-btn').setAttribute('aria-expanded',open);
}
function goSection(k){
  const u=me();if(!u)return;
  toggleMenu(false);
  if(!allowedKeys(u.Role).includes(k)){
    addLog(u.Email,u.Role,'Unauthorized access: '+k,'Blocked');
    $('content').innerHTML=`<div class="acc-denied"><h2>Access denied</h2><p>You do not have permission to open this page. The attempt has been logged.</p></div>`;
    return;
  }
  try{localStorage.setItem('itech_curSec',k)}catch(e){}
  document.querySelectorAll('.ni').forEach(e=>e.classList.remove('active'));
  const el=$('ni-'+k);if(el)el.classList.add('active');
  const item=NAV[u.Role].find(n=>Array.isArray(n)&&n[0]===k);
  const title=item?item[1]:'Dashboard';
  $('pg-title').textContent=title;document.title=title+' | iTech Uni';
  $('content').innerHTML=SECS[k]();
  window.scrollTo(0,0);
  if(k==='create_user')toggleRoleFields();
}

/* sections */
const SECS={
dashboard(){
  const u=me(),role=u.Role;
  if(role==='admin'){
    const n=r=>DB.users.filter(x=>x.Role===r).length;
    const blk=DB.secLogs.filter(l=>l.Status==='Blocked').length;
    return `<div class="stats">
      <div class="sc"><div class="val">${DB.users.length}</div><div class="lbl">Total users</div></div>
      <div class="sc"><div class="val">${n('teacher')}</div><div class="lbl">Teachers</div></div>
      <div class="sc"><div class="val">${n('student')}</div><div class="lbl">Students</div></div>
      <div class="sc" style="border-left-color:var(--danger)"><div class="val">${blk}</div><div class="lbl">Blocked attempts</div></div></div>`+
      card('Recent security activity',tbl(['User','Activity','Status'],DB.secLogs.slice(-8).reverse().map(l=>[esc(l.Email),esc(l.Activity),badge(l.Status)]),'No activity recorded yet.'));
  }
  if(role==='teacher'){
    const mine=DB.students.filter(s=>s['Created By']===u.Email);
    const myCourses=DB.courses.filter(c=>c['Teacher Name']===u['Full Name']).length;
    return `<div class="stats">
      <div class="sc"><div class="val">${DB.students.length}</div><div class="lbl">Students</div></div>
      <div class="sc"><div class="val">${myCourses}</div><div class="lbl">My courses</div></div>
      <div class="sc"><div class="val">${DB.marks.length}</div><div class="lbl">Marks recorded</div></div>
      <div class="sc"><div class="val">${mine.length}</div><div class="lbl">Registered by me</div></div></div>`+
      card('Students I registered',tbl(['ID','Name','Contact','Program'],mine.map(s=>[v(s.StudentID),`<strong>${esc(s['Full Name'])}</strong>`,`${esc(s.Email)}<br><small>${v(s.Phone)}</small>`,v(s.Program)]),'You have not registered any students yet.'),
        '<button class="btn btn-primary btn-sm" onclick="goSection(\'create_user\')">Register student</button>');
  }
  if(role==='student'){
    const s=myStu(),id=s&&s.StudentID;
    const marks=DB.marks.filter(m=>m.StudentID===id),att=DB.attendance.filter(a=>a.StudentID===id);
    const pres=att.filter(a=>a.Status==='Present').length;
    return `<div class="welcome"><small>Signed in as</small><h3>${esc(u['Full Name'])}</h3><small>${v(s&&s.Program)}${id?' | '+esc(id):''}</small></div>
    <div class="stats">
      <div class="sc"><div class="val">${new Set(marks.map(m=>m.CourseID)).size}</div><div class="lbl">Courses with results</div></div>
      <div class="sc"><div class="val">${att.length?Math.round(pres/att.length*100)+'%':'N/A'}</div><div class="lbl">Attendance</div></div>
      <div class="sc"><div class="val">${v(s&&s.CGPA)}</div><div class="lbl">CGPA</div></div></div>`+
      card('My results',marksTbl(marks));
  }
  const cnt=s=>DB.fees.filter(f=>f.Status===s).length;
  return `<div class="stats">
    <div class="sc"><div class="val">${DB.fees.length}</div><div class="lbl">Fee records</div></div>
    <div class="sc" style="border-left-color:var(--success)"><div class="val">${cnt('Paid')}</div><div class="lbl">Paid</div></div>
    <div class="sc" style="border-left-color:var(--warn)"><div class="val">${cnt('Pending')}</div><div class="lbl">Pending</div></div>
    <div class="sc" style="border-left-color:var(--danger)"><div class="val">${cnt('Overdue')}</div><div class="lbl">Overdue</div></div></div>`+
    card('Fee records',feeTbl(false));
},
create_user(){
  const role=me().Role,allowed=CAN_CREATE[role]||[];
  if(!allowed.length)return `<div class="acc-denied"><h2>Not permitted</h2><p>Your role cannot create accounts.</p></div>`;
  const pick=allowed.length===1
    ?`<input type="hidden" id="nu-role" value="${allowed[0]}">`
    :`<div class="fg"><label for="nu-role">Account role</label><select id="nu-role" onchange="toggleRoleFields()">${allowed.map(r=>`<option value="${r}">${ROLE_META[r].label}</option>`).join('')}</select></div>`;
  return card(role==='teacher'?'Register a new student':'Create a new account',`
    <div class="alert">You can create: ${allowed.map(r=>ROLE_META[r].label).join(', ')}.</div>${pick}
    <div class="form-row">
      <div class="fg"><label for="nu-name">Full name</label><input type="text" id="nu-name" autocomplete="off"></div>
      <div class="fg"><label for="nu-email">Email</label><input type="email" id="nu-email" autocomplete="off" inputmode="email"></div>
    </div>
    <div class="fg"><label for="nu-pass">Password</label>
      <input type="password" id="nu-pass" autocomplete="new-password" placeholder="8+ characters, uppercase, number, symbol" oninput="strCheck(this.value)">
      <div class="str-bar"><div class="str-fill" id="nu-str"></div></div></div>
    <div class="form-row">
      <div class="fg"><label for="nu-phone">Phone</label><input type="tel" id="nu-phone" placeholder="0300-0000000"></div>
      <div class="fg"><label for="nu-dept">Department</label><input type="text" id="nu-dept"></div>
    </div>
    <div id="student-extra" class="form-row">
      <div class="fg"><label for="nu-prog">Program</label><input type="text" id="nu-prog"></div>
      <div class="fg"><label for="nu-sem">Semester</label><input type="number" id="nu-sem" min="1" max="8"></div>
    </div>
    <button class="btn btn-primary" onclick="saveNewUser()">Create account</button>`);
},
users(){
  const rows=DB.users.map(u=>[v(u.UserID),`<strong>${esc(u['Full Name'])}</strong>`,`${esc(u.Email)}<br><small>${v(u.Phone)}</small>`,`<span class="badge bg-info">${esc(u.Role)}</span>`,v(u['Created By (UserID)']),badge(u.Status),
    `<div class="acts"><button class="btn btn-outline btn-sm" data-email="${esc(u.Email)}" onclick="editUser(this.dataset.email)">Edit</button>`+
    (u.Email===me().Email?'':`<button class="btn btn-danger btn-sm" data-email="${esc(u.Email)}" onclick="toggleUser(this.dataset.email)">${u.Status==='locked'?'Unlock':'Lock'}</button>`)+`</div>`]);
  return card('All users',tbl(['ID','Name','Contact','Role','Created by','Status','Actions'],rows),'<button class="btn btn-primary btn-sm" onclick="goSection(\'create_user\')">Create account</button>');
},
students(){
  const isT=me().Role==='teacher';
  return card('Students',tbl(['ID','Name','Contact','Program','Semester','CGPA','Status'],DB.students.map(s=>[v(s.StudentID),`<strong>${esc(s['Full Name'])}</strong>`,`${esc(s.Email)}<br><small>${v(s.Phone)}</small>`,v(s.Program),v(s.Semester),v(s.CGPA),badge(s.Status)]),'No students yet.'),
    isT?'<button class="btn btn-primary btn-sm" onclick="goSection(\'create_user\')">Register student</button>':'');
},
courses(){
  const rows=DB.courses.map(c=>[`<span class="chip">${esc(c.CourseID)}</span>`,`<strong>${esc(c['Course Name'])}</strong>`,v(c['Teacher Name']),
    new Set(DB.marks.filter(m=>m.CourseID===c.CourseID).map(m=>m.StudentID)).size,v(c.Credits),badge(c.Status)]);
  return card('Courses',tbl(['ID','Name','Teacher','Students with marks','Credits','Status'],rows,'No courses yet.'));
},
marks(){
  const isS=me().Role==='student',s=myStu();
  const list=isS?DB.marks.filter(m=>s&&m.StudentID===s.StudentID):DB.marks;
  return card(isS?'My marks':'All marks',marksTbl(list,!isS),isS?'':'<button class="btn btn-primary btn-sm" onclick="showAddMark()">Add mark</button>');
},
results(){return SECS.marks()},
attendance(){
  const isS=me().Role==='student',s=myStu();
  const list=isS?DB.attendance.filter(a=>s&&a.StudentID===s.StudentID):DB.attendance;
  const pres=list.filter(a=>a.Status==='Present').length,pct=list.length?Math.round(pres/list.length*100):0;
  const sum=isS&&list.length?`<div style="text-align:center;margin-bottom:14px"><div style="font-size:40px;font-weight:700;color:${pct>=75?'var(--success)':'var(--danger)'}">${pct}%</div><div style="color:var(--muted);font-size:13px">${pres} of ${list.length} classes attended</div></div>`:'';
  return card('Attendance',sum+tbl(['Student','Course','Date','Status'],list.map(a=>[esc(a['Student Name']),esc(a.CourseID),esc(a.Date),badge(a.Status)]),'No attendance records yet.'),
    isS?'':'<button class="btn btn-primary btn-sm" onclick="showMarkAtt()">Mark attendance</button>');
},
fees(){return card('Fee records',feeTbl(true))},
logs(){
  return card('Security audit log',tbl(['#','Email','Role','Activity','Status','Time'],[...DB.secLogs].reverse().map((l,i)=>[i+1,esc(l.Email),esc(l.Role),esc(l.Activity),badge(l.Status),esc(l.Timestamp)]),'No log entries yet.'),
    `<span class="badge bg-info">${DB.secLogs.length} entries</span>`);
},
profile(){
  const u=me();
  const f=[['Full name',u['Full Name']],['Email',u.Email],['Role',(ROLE_META[u.Role]||{}).label||u.Role],['Phone',u.Phone],['Status',u.Status],['Department',u.Department]];
  return card('My profile',`<div class="pgrid">${f.map(x=>`<div><small>${x[0]}</small><strong>${v(x[1])}</strong></div>`).join('')}</div>
    <div style="margin-top:18px"><button class="btn btn-outline btn-sm" onclick="showChangePw()">Change password</button></div>`);
}
};

function marksTbl(list,showName){
  const heads=showName?['Student','Course','Midterm','Final','Total','Grade']:['Course','Midterm','Final','Total','Grade'];
  return tbl(heads,list.map(m=>{
    const r=[`<span class="chip">${esc(m.CourseID)}</span>`,esc(m['Midterm/50'])+'/50',esc(m['Final/100'])+'/100',esc(m['Total/150'])+'/150',`<span class="badge ${m.Grade==='F'?'bg-danger':'bg-success'}">${esc(m.Grade)}</span>`];
    return showName?[esc(m['Student Name'])].concat(r):r;
  }),'No results recorded yet.');
}
function feeTbl(act){
  const heads=['ID','Student','Amount','Due date','Status'].concat(act?['Action']:[]);
  return tbl(heads,DB.fees.map(f=>{
    const r=[esc(f.FeeID),esc(f['Student Name']),'PKR '+Number(f['Amount(PKR)']||0).toLocaleString('en-PK'),esc(f['Due Date']),badge(f.Status)];
    if(act)r.push(f.Status!=='Paid'?`<button class="btn btn-success btn-sm" data-id="${esc(f.FeeID)}" onclick="markPaid(this.dataset.id)">Mark paid</button>`:'Done');
    return r;
  }),'No fee records yet.');
}

/* password strength */
function isStrong(p){return p.length>=8&&/[A-Z]/.test(p)&&/[0-9]/.test(p)&&/[^A-Za-z0-9]/.test(p)}
function strCheck(p,id){
  let s=0;if(p.length>=8)s++;if(/[A-Z]/.test(p))s++;if(/[0-9]/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;
  const el=$(id||'nu-str');el.style.width=s*25+'%';el.style.background=['#ccc','#c0392b','#b9770e','#1976d2','#1e8449'][s];
}

/* modal */
function openM(title,body,foot){$('m-title').textContent=title;$('m-body').innerHTML=body;$('m-foot').innerHTML=foot||'';$('modal').hidden=false}
function closeM(){$('modal').hidden=true}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeM();toggleMenu(false)}});

/* actions */
function toggleRoleFields(){const r=$('nu-role');if(r&&$('student-extra'))$('student-extra').hidden=r.value!=='student'}
function saveNewUser(){
  const u=me(),role=$('nu-role').value,name=$('nu-name').value.trim(),email=$('nu-email').value.trim(),pass=$('nu-pass').value;
  const phone=$('nu-phone').value.trim(),dept=$('nu-dept').value.trim();
  if(!name)return toast('Enter the full name.',1);
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast('Enter a valid email address.',1);
  if(!isStrong(pass))return toast('Password needs 8+ characters, an uppercase letter, a number and a symbol.',1);
  if(!canCreate(role))return toast('You cannot create '+role+' accounts.',1);
  if(findUser(email))return toast('An account with this email already exists.',1);
  const now=new Date().toISOString().split('T')[0];
  const prog=role==='student'?$('nu-prog').value.trim():'',sem=role==='student'?$('nu-sem').value:'';
  DB.users.push({UserID:'U'+String(DB.users.length+1).padStart(3,'0'),'Full Name':name,Email:email,Password:pass,Role:role,'Created By (UserID)':u.UserID,'Created By Role':u.Role,Status:'active','Created Date':now,'Last Login':'',Phone:phone,Department:dept});
  const base={'Full Name':name,Email:email,Password:pass,Phone:phone,Status:'active','Created Date':now};
  const pad=(p,t)=>p+String(DB[t].length+1).padStart(3,'0');
  if(role==='student')DB.students.push(Object.assign({StudentID:pad('STU','students')},base,{Program:prog,Semester:sem,Section:'A',CGPA:'','Created By':u.Email,'Creator Role':u.Role}));
  else if(role==='teacher')DB.teachers.push(Object.assign({TeacherID:pad('T','teachers')},base,{Department:dept,'Created By Admin':u.Email}));
  else if(role==='accountant')DB.accountants.push(Object.assign({AccountantID:pad('ACC','accountants')},base,{Department:dept,'Created By Admin':u.Email}));
  saveDB();addLog(u.Email,u.Role,`Created ${role} account: ${email}`,'Success');
  goSection(u.Role==='teacher'?'students':'users');
  toast(`${ROLE_META[role].label} account created for ${name}.`);
}
function editUser(email){
  const u=findUser(email);if(!u)return toast('User not found.',1);
  openM('Edit user',`<div class="fg"><label for="eu-name">Full name</label><input type="text" id="eu-name" value="${esc(u['Full Name'])}"></div>
    <div class="fg"><label for="eu-phone">Phone</label><input type="tel" id="eu-phone" value="${esc(u.Phone)}"></div>
    <div class="fg"><label for="eu-dept">Department</label><input type="text" id="eu-dept" value="${esc(u.Department)}"></div>`,
    `<button class="btn btn-outline btn-sm" onclick="closeM()">Cancel</button><button class="btn btn-primary btn-sm" data-email="${esc(email)}" onclick="saveEditUser(this.dataset.email)">Save</button>`);
}
function saveEditUser(email){
  const u=findUser(email),name=$('eu-name').value.trim();
  if(!name)return toast('Name cannot be empty.',1);
  u['Full Name']=name;u.Phone=$('eu-phone').value.trim();u.Department=$('eu-dept').value.trim();
  syncRole(email,{'Full Name':u['Full Name'],Phone:u.Phone,Department:u.Department});
  saveDB();addLog(me().Email,me().Role,'User updated: '+email,'Success');
  closeM();goSection('users');toast('User updated.');
}
function toggleUser(email){
  if(email===me().Email)return toast('You cannot lock your own account.',1);
  const u=findUser(email);if(!u)return;
  u.Status=u.Status==='locked'?'active':'locked';
  syncRole(email,{Status:u.Status});
  saveDB();addLog(me().Email,me().Role,`Account ${u.Status==='locked'?'locked':'unlocked'}: ${email}`,'Success');
  goSection('users');toast(`Account ${u.Status==='locked'?'locked':'unlocked'}.`);
}
function studentOpts(){return DB.students.map(s=>`<option value="${esc(s.StudentID)}">${esc(s['Full Name'])} (${esc(s.StudentID)})</option>`).join('')}
function courseOpts(){return DB.courses.map(c=>`<option value="${esc(c.CourseID)}">${esc(c.CourseID)} ${esc(c['Course Name'])}</option>`).join('')}
function showAddMark(){
  if(!DB.students.length||!DB.courses.length)return toast('Add at least one student and one course first.',1);
  openM('Add mark',`<div class="fg"><label for="am-stu">Student</label><select id="am-stu">${studentOpts()}</select></div>
    <div class="fg"><label for="am-crs">Course</label><select id="am-crs">${courseOpts()}</select></div>
    <div class="form-row"><div class="fg"><label for="am-mid">Midterm (max 50)</label><input type="number" id="am-mid" min="0" max="50" inputmode="numeric"></div>
    <div class="fg"><label for="am-fin">Final (max 100)</label><input type="number" id="am-fin" min="0" max="100" inputmode="numeric"></div></div>`,
    `<button class="btn btn-outline btn-sm" onclick="closeM()">Cancel</button><button class="btn btn-primary btn-sm" onclick="saveMark()">Save</button>`);
}
function saveMark(){
  const sid=$('am-stu').value,crs=$('am-crs').value,mid=parseInt($('am-mid').value,10),fin=parseInt($('am-fin').value,10);
  if(isNaN(mid)||mid<0||mid>50)return toast('Midterm must be between 0 and 50.',1);
  if(isNaN(fin)||fin<0||fin>100)return toast('Final must be between 0 and 100.',1);
  const s=DB.students.find(x=>x.StudentID===sid),t=mid+fin;
  const grade=t>=135?'A+':t>=120?'A':t>=105?'B+':t>=90?'B':t>=75?'C':'F';
  DB.marks.push({StudentID:sid,'Student Name':s['Full Name'],CourseID:crs,'Midterm/50':mid,'Final/100':fin,'Total/150':t,Grade:grade});
  saveDB();addLog(me().Email,me().Role,`Marks added: ${s['Full Name']} ${crs}`,'Success');
  closeM();goSection('marks');toast('Marks saved.');
}
function showMarkAtt(){
  if(!DB.students.length||!DB.courses.length)return toast('Add at least one student and one course first.',1);
  openM('Mark attendance',`<div class="fg"><label for="ma-stu">Student</label><select id="ma-stu">${studentOpts()}</select></div>
    <div class="fg"><label for="ma-crs">Course</label><select id="ma-crs">${courseOpts()}</select></div>
    <div class="fg"><label for="ma-date">Date</label><input type="date" id="ma-date" value="${new Date().toISOString().split('T')[0]}"></div>
    <div class="fg"><label for="ma-status">Status</label><select id="ma-status"><option>Present</option><option>Absent</option><option>Late</option></select></div>`,
    `<button class="btn btn-outline btn-sm" onclick="closeM()">Cancel</button><button class="btn btn-primary btn-sm" onclick="saveAtt()">Save</button>`);
}
function saveAtt(){
  const sid=$('ma-stu').value,date=$('ma-date').value;
  if(!date)return toast('Choose a date.',1);
  const s=DB.students.find(x=>x.StudentID===sid);
  DB.attendance.push({StudentID:sid,'Student Name':s['Full Name'],CourseID:$('ma-crs').value,Date:date,Status:$('ma-status').value,'Marked By':me().Email});
  saveDB();closeM();goSection('attendance');toast('Attendance saved.');
}
function markPaid(id){
  const f=DB.fees.find(x=>x.FeeID===id);if(!f)return;
  f.Status='Paid';f['Paid Date']=new Date().toISOString().split('T')[0];f['Received By']=me().Email;
  saveDB();addLog(me().Email,me().Role,'Fee marked paid: '+id,'Success');
  goSection('fees');toast('Fee marked as paid.');
}
function showChangePw(){
  openM('Change password',`<div class="fg"><label for="cp-old">Current password</label><input type="password" id="cp-old" autocomplete="current-password"></div>
    <div class="fg"><label for="cp-new">New password</label><input type="password" id="cp-new" autocomplete="new-password" oninput="strCheck(this.value,'cp-str')"><div class="str-bar"><div class="str-fill" id="cp-str"></div></div></div>
    <div class="fg"><label for="cp-con">Confirm new password</label><input type="password" id="cp-con" autocomplete="new-password"></div>`,
    `<button class="btn btn-outline btn-sm" onclick="closeM()">Cancel</button><button class="btn btn-primary btn-sm" onclick="doChangePw()">Update password</button>`);
}
function doChangePw(){
  const u=me(),np=$('cp-new').value;
  if($('cp-old').value!==u.Password)return toast('Current password is incorrect.',1);
  if(!isStrong(np))return toast('New password needs 8+ characters, an uppercase letter, a number and a symbol.',1);
  if(np!==$('cp-con').value)return toast('Passwords do not match.',1);
  u.Password=np;syncRole(u.Email,{Password:np});
  saveDB();addLog(u.Email,u.Role,'Password changed','Success');
  closeM();toast('Password updated.');
}

/* init */
function tick(){const c=$('clk');if(c)c.textContent=new Date().toLocaleString('en-PK',{dateStyle:'medium',timeStyle:'short'})}
tick();setInterval(tick,30000);
genCap();
if(SESSION)loadApp();
</script>
